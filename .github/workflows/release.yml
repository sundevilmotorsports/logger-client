name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether this push bumped the version in Cargo.toml. Everything
  # downstream only runs when it did.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          get_version() { grep -m1 '^version' "$1" | sed -E 's/.*"(.*)".*/\1/'; }

          new_version="$(get_version Cargo.toml)"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "No usable previous commit; treating as version change."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_version="$(git show "$before:Cargo.toml" 2>/dev/null | grep -m1 '^version' | sed -E 's/.*"(.*)".*/\1/' || true)"
          echo "old=$old_version new=$new_version"
          if [[ "$old_version" != "$new_version" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build a release binary on each target OS and upload it as an artifact.
  # ---------------------------------------------------------------------------
  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold clang libclang-dev \
            libasound2-dev libfontconfig-dev libssl-dev libzstd-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libgit2-dev

      - name: Set libclang path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          target="${{ matrix.target }}"
          name="logger-client-${version}-${target}"
          bindir="target/${target}/release"
          mkdir -p dist

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/${name}.zip" "./${bindir}/logger-client.exe" >/dev/null
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "dist/${name}.tar.gz" -C "${bindir}" logger-client
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: logger-client-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect every build artifact and publish a GitHub release tagged v<version>.
  # ---------------------------------------------------------------------------
  release:
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
