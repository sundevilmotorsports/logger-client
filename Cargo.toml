[package]
name = "logger-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
pathfinder_color = "0.5.0"
rust-embed = "8.11.0"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
warpui = { git = "https://github.com/warpdotdev/warp", package = "warpui" }
log = "0.4.29"
env_logger = "0.11"
