[package]
name = "logger-client"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
log = "0.4.29"
env_logger = "0.11"
sdm-utils = { git = "https://github.com/sundevilmotorsports/sdm-utils.git", features = ["alloc"] }
chrono = "0.4"
slint = "1.18"
rfd = "0.17"

[build-dependencies]
slint-build = "1.18"
