[package]
name = "logger-client"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
rust-embed = "8.11.0"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
log = "0.4.29"
env_logger = "0.11"
gpui = "0.2.2"
gpui-component = "0.5.1"
sdm-utils = { git = "https://github.com/sundevilmotorsports/sdm-utils.git" }
